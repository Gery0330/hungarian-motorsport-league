<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMBlog</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{
 margin:0;
 font-family:Arial;
 background:#05070c;
 color:white;
}

/* LOGIN */
.auth{
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 gap:15px;
}

.auth input{
 padding:12px;
 width:250px;
 border:none;
 border-radius:8px;
}

.auth button{
 padding:12px 20px;
 background:#ff1e00;
 border:none;
 color:white;
 border-radius:8px;
 cursor:pointer;
}

/* FEED */
.feed{
 display:none;
 padding-top:80px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:30px;
}

.post{
 width:100%;
 max-width:500px;
 background:#0f172a;
 border-radius:16px;
 overflow:hidden;
}

.post img{
 width:100%;
}

.post-content{
 padding:15px;
}

.add-post{
 position:fixed;
 bottom:20px;
 right:20px;
 width:60px;
 height:60px;
 border-radius:50%;
 background:#ff1e00;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:28px;
 cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="auth" id="authBox">
<h2>HMBlog Login</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Bejelentkezés</button>
<button onclick="register()">Fiók létrehozása</button>
</div>

<!-- FEED -->
<div class="feed" id="feed"></div>

<div class="add-post" onclick="addPost()">+</div>

<script>

// LOGIN
async function login(){

 const email = document.getElementById("email").value;
 const password = document.getElementById("password").value;

 const { error } = await window.supabaseClient.auth.signInWithPassword({
   email,
   password
 });

 if(error){
   alert(error.message);
 } else {
   loadApp();
 }

}

// REGISTER
async function register(){

 const email = document.getElementById("email").value;
 const password = document.getElementById("password").value;

 const { error } = await supabase.auth.signUp({
   email,
   password
 });

 if(error){
   alert(error.message);
 } else {
   alert("Sikeres regisztráció!");
 }

}

// APP LOAD
async function loadApp(){

 document.getElementById("authBox").style.display="none";
 document.getElementById("feed").style.display="flex";

 loadPosts();
}

// POSTS LOAD
async function loadPosts(){

 const { data, error } = await supabase
   .from("posts")
   .select("*")
   .order("id", { ascending:false });
 
 if(error){
  console.error(error);
  alert("Hiba a betöltésnél");
  return;
 }

 const feed = document.getElementById("feed");
 feed.innerHTML="";

 data.forEach(p=>{

  const div = document.createElement("div");
  div.className="post";

  div.innerHTML=`
    <img src="${p.image || 'https://via.placeholder.com/500'}">
    <div class="post-content">${p.text}</div>
  `;

  feed.appendChild(div);
 });

}

// ADD POST
async function addPost(){

 const text = prompt("Poszt szöveg:");

 if(!text) return;

 await supabase.from("posts").insert([{
   text:text
 }]);

 loadPosts();
}

// AUTO LOGIN
supabase.auth.getSession().then(({ data })=>{
 if(data.session){
   loadApp();
 }
});
</script>

</body>
</html>
