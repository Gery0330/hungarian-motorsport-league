<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>HMBlog</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{
 margin:0;
 font-family:"Segoe UI",sans-serif;
 background:#0b0f18;
 color:white;
}

/* TOPBAR */
.topbar{
 position:fixed;
 top:0;
 width:100%;
 height:85px;
 background:#0f172a;
 display:flex;
 align-items:center;
 justify-content:center;
 border-bottom:1px solid rgba(255,255,255,0.08);
 z-index:1000;
}

.logo{
 height:80px;
}

.top-actions{
 position:absolute;
 right:20px;
 display:flex;
 gap:10px;
}

.langbtn{
 background:#ff1e00;
 border:none;
 padding:6px 10px;
 color:white;
 border-radius:6px;
 cursor:pointer;
}

/* AUTH */
.auth{
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 gap:10px;
}

.auth input{
 padding:12px;
 width:250px;
 border-radius:8px;
 border:none;
}

.auth button{
 padding:12px;
 width:250px;
 border:none;
 border-radius:8px;
 background:#ff1e00;
 color:white;
 cursor:pointer;
}

/* FEED */
.feed{
 display:none;
 padding-top:90px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:25px;
}

.post{
 width:100%;
 max-width:500px;
 background:#0f172a;
 border-radius:16px;
 overflow:hidden;

 box-shadow:0 0 20px rgba(0,0,0,0.4);
 transition:0.3s;
}

.post:hover{
 transform:translateY(-3px);
 box-shadow:0 0 30px rgba(0,0,0,0.6);
}

.post-header{
 padding:12px;
 font-weight:bold;
 border-bottom:1px solid rgba(255,255,255,0.05);
}

.post img{
 width:100%;
}

.post-content{
 padding:15px;
}

/* FLOAT BUTTON */
.create{
 position:fixed;
 bottom:20px;
 right:20px;

 width:60px;
 height:60px;

 display:flex;
 align-items:center;
 justify-content:center;

 background:#ff1e00;
 border-radius:50%;

 font-size:24px;
 cursor:pointer;
}

/* MODAL */
.modal{
 position:fixed;
 top:0;
 left:0;
 width:100%;
 height:100%;
 background:rgba(0,0,0,0.8);
 display:none;
 align-items:center;
 justify-content:center;
}

.modal-box{
 background:#0f172a;
 padding:20px;
 border-radius:12px;
 display:flex;
 flex-direction:column;
 gap:10px;
}

.modal-box textarea,
.modal-box input{
 width:300px;
 padding:10px;
}

/* 📱 MOBILE OPTIMIZATION */
@media (max-width:768px){

 /* TOPBAR */
 .topbar{
  height:60px;
 }

 .logo{
  height:32px;
 }

 .top-actions{
  right:10px;
  gap:6px;
 }

 .langbtn{
  padding:5px 8px;
  font-size:12px;
 }

 /* AUTH */
 .auth input,
 .auth button{
  width:85%;
  max-width:300px;
 }

 /* FEED */
 .feed{
  padding-top:70px;
  gap:18px;
 }

 /* POST */
 .post{
  width:92%;
  border-radius:12px;
 }

 .post-header{
  font-size:13px;
  padding:10px;
 }

 .post-content{
  font-size:13px;
  padding:12px;
 }

 /* FLOAT BUTTON */
 .create{
  bottom:15px;
  right:15px;
  padding:14px;
  font-size:20px;
 }

 /* MODAL */
 .modal-box{
  width:90%;
  max-width:350px;
 }

 .modal-box textarea,
 .modal-box input{
  width:100%;
 }

}

button{
 touch-action:manipulation;
}

input, textarea{
 font-size:16px;
}

.post img{
 width:100%;
 height:auto;
 object-fit:cover;
}

#chat{
 display:flex;
 flex-direction:column;
}

span:hover{
 opacity:0.8;
 transform:scale(1.05);
 transition:0.2s;
}

</style>
</head>

<body>

<div class="topbar">
 <img src="hmblogo.png" class="logo">

 <div class="top-actions">
  <button class="langbtn" onclick="toggleLang()">HU/EN</button>
  <div id="profileBtn" onclick="toggleMenu()" style="display:flex;align-items:center;gap:8px;cursor:pointer;">
   <img id="avatarTop" src="https://via.placeholder.com/40" style="width:32px;height:32px;border-radius:50%;">
   <span id="profileName">User</span>
  </div>
  
  <div id="dropdown" style="display:none;position:absolute;top:70px;right:20px;background:#0f172a;padding:10px;border-radius:8px;">
   <div onclick="openProfile()">Profil</div>
   <div onclick="logout()">Logout</div>
  </div>
 </div>
</div>

<!-- LOGIN -->
<div class="auth" id="authBox">
<h2 data-hu="Bejelentkezés" data-en="Login">Bejelentkezés</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()" data-hu="Belépés" data-en="Login">Belépés</button>
<button onclick="register()" data-hu="Regisztráció" data-en="Register">Regisztráció</button>
</div>

<!-- FEED -->
<div class="feed" id="feed"></div>

<div class="create" onclick="openPost()">+</div>

<!-- POST MODAL -->
<div class="modal" id="postModal">
 <div class="modal-box">
  <textarea id="postText" 
  data-hu="Mit gondolsz?" 
  data-en="What's on your mind?"
  placeholder="Mit gondolsz?"></textarea>

  <button onclick="sendPost()" data-hu="Posztolás" data-en="Post">Posztolás</button>
 </div>
</div>

<!-- PROFILE MODAL -->
<div class="modal" id="profileModal">
 <div class="modal-box">
  <input id="username" placeholder="Username">
  <input type="file" id="avatarInput">
  <button onclick="saveProfile()" data-hu="Mentés" data-en="Save">Mentés</button>
 </div>
</div>

<script>

let lang = localStorage.getItem("lang") || "hu";
let currentUser=null;
let currentProfile=null;

/* LANGUAGE */
function toggleLang(){
 lang = lang==="hu"?"en":"hu";
 localStorage.setItem("lang",lang);

 document.querySelectorAll("[data-hu]").forEach(el=>{
  el.innerText = el.getAttribute("data-"+lang);
 });
}

/* LOGIN */
async function login(){
 const {error} = await window.supabaseClient.auth.signInWithPassword({
  email:email.value,
  password:password.value
 });
 if(error) alert(error.message);
 else loadApp();
}

/* REGISTER */
async function register(){
 const {error} = await window.supabaseClient.auth.signUp({
  email:email.value,
  password:password.value
 });
 if(error) alert(error.message);
 else alert("OK");
}

/* LOAD USER */
async function loadUser(){
 const {data} = await window.supabaseClient.auth.getUser();
 currentUser = data.user;

 const {data:profile, error} = await window.supabaseClient
   .from("profiles")
   .select("*")
   .eq("id",currentUser.id)
   .maybeSingle();
 if(error){
  console.error(error);
 if(profile && profile.username){
  document.getElementById("profileName").innerText = profile.username;
 }
 }
 
 currentProfile=profile;

 if(!profile || !profile.username){
  profileModal.style.display="flex";
 }

 if(profile){
  if(profile.username){
   profileName.innerText = profile.username;
  }
  if(profile.avatar_url){
   avatarTop.src = profile.avatar_url;
  }
 }
 
}

/* SAVE PROFILE */
async function saveProfile(){

 const name = username.value.trim();

 if(!/^[A-Za-z0-9_]{3,20}$/.test(name)){
   alert("Username: 3-20 karakter, betűk, számok és _");
   return;
 }

 let avatarUrl = currentProfile?.avatar_url || null;

 const file = avatarInput.files[0];

 if(file){
  const fileName = currentUser.id + ".png";

  await window.supabaseClient.storage
   .from("avatars")
   .upload(fileName, file, { upsert:true });

  avatarUrl = window.supabaseClient
   .storage.from("avatars")
   .getPublicUrl(fileName).data.publicUrl;
 }

 const { error } = await window.supabaseClient.from("profiles").upsert({
  id:currentUser.id,
  username:name,
  avatar_url:avatarUrl
 });

 if(error){
  if(error.message.toLowerCase().includes("duplicate")){
    alert("Username foglalt!");
  } else {
    alert("Hiba!");
  }
  return;
 }

 currentProfile = { username:name, avatar_url:avatarUrl };

 document.getElementById("profileName").innerText = name;
 document.getElementById("avatarTop").src = avatarUrl || "https://via.placeholder.com/40";

 profileModal.style.display="none";
}

/* LOAD APP */
async function loadApp(){
 authBox.style.display="none";
 feed.style.display="flex";
 await loadUser();
 loadPosts();
}

/* LOAD POSTS */
async function loadPosts(){
 const {data} = await window.supabaseClient
   .from("posts")
   .select(`
    *,
    profiles ( username, avatar_url ),
    comments ( text ),
    likes ( id )
   `)
   .order("id",{ascending:false});

 feed.innerHTML="";

 data.forEach(p=>{
  const div=document.createElement("div");
  div.className="post";

  div.innerHTML=`
   <div class="post-header" style="display:flex;align-items:center;gap:10px;">
    <img src="${p.profiles?.avatar_url || 'https://via.placeholder.com/30'}"
    style="width:32px;height:32px;border-radius:50%;">
    <div style="font-weight:bold;">
     ${p.profiles?.username || "User"}
    </div>
   </div>
   <img src="${p.image||'https://via.placeholder.com/500'}">
   <div class="post-content">${p.text}</div>
   
   <div style="padding:10px;display:flex;gap:15px;font-size:14px;">
    <span onclick="likePost(${p.id})" style="cursor:pointer;">
     ❤️ ${p.likes?.length || 0}
    </span>
    <span style="opacity:0.7;">
     💬 Komment
    </span>
   </div>

   <div style="padding:10px;">
    ${
     (p.comments || []).map(c => `
      <div style="margin-bottom:6px;font-size:13px;">
       💬 ${c.text}
      </div>
     `).join("")
    }
   </div>
  `;

  feed.appendChild(div);
 });
}

/* POST */
function openPost(){ postModal.style.display="flex"; }

async function sendPost(){
 await window.supabaseClient.from("posts").insert([{
  text:postText.value,
  user_id:currentUser.id
 }]);
 postModal.style.display="none";
 postText.value="";
 loadPosts();
 await loadPosts();
}

/* PROFILE */
function openProfile(){
 profileModal.style.display="flex";
 if(currentProfile) username.value=currentProfile.username;
}

/* AUTO LOGIN */
window.supabaseClient.auth.getSession().then(({data})=>{
 if(data.session) loadApp();
});

/* INIT LANG */
toggleLang();

function toggleMenu(){
 const d = document.getElementById("dropdown");
 d.style.display = d.style.display==="block"?"none":"block";
}

async function logout(){
 await window.supabaseClient.auth.signOut();
 location.reload();
}

async function likePost(postId){

 const { data: existing } = await window.supabaseClient
  .from("likes")
  .select("*")
  .eq("post_id", postId)
  .eq("user_id", currentUser.id)
  .maybeSingle();

 if(existing){
  await window.supabaseClient
   .from("likes")
   .delete()
   .eq("id", existing.id);
 } else {
  await window.supabaseClient
   .from("likes")
   .insert([{ post_id:postId, user_id:currentUser.id }]);
 }

 loadPosts();
}

async function addComment(e, postId){
 if(e.key !== "Enter") return;

 await window.supabaseClient.from("comments").insert([{
  text:e.target.value,
  post_id:postId,
  user_id:currentUser.id
 }]);

 e.target.value="";
 loadPosts();
}

document.getElementById("chatInput").addEventListener("keydown", async e=>{
 if(e.key !== "Enter") return;

 await window.supabaseClient.from("messages").insert([{
  text:e.target.value,
  user_id:currentUser.id
 }]);

 e.target.value="";
});

async function loadChat(){

 const { data } = await window.supabaseClient
  .from("messages")
  .select("*")
  .order("id",{ascending:true});

 const chat = document.getElementById("chat");
 chat.innerHTML="";

 data.forEach(m=>{
  const div=document.createElement("div");
  div.innerHTML = `
   <div style="
    background:${m.user_id === currentUser.id ? '#ff1e00' : '#222'};
    padding:8px 12px;
    margin:5px;
    border-radius:12px;
    max-width:70%;
    align-self:${m.user_id === currentUser.id ? 'flex-end' : 'flex-start'};
   ">
    ${m.text}
   </div>
  `;
  chat.appendChild(div);
 });
}

setInterval(loadChat, 2000);

</script>

<div id="chat" style="position:fixed;bottom:50px;width:100%;max-height:200px;overflow:auto;"></div>

<div style="position:fixed;bottom:0;width:100%;background:#111;padding:10px;">
 <input id="chatInput" placeholder="Üzenet..." style="width:80%;">
</div>

</body>
</html>
