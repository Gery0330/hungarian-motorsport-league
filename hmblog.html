<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMBlog</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{
 margin:0;
 font-family:"Segoe UI",sans-serif;
 background:#0b0f18;
 color:white;
}

/* TOPBAR */
.topbar{
 position:fixed;
 top:0;
 width:100%;
 height:60px;
 background:#0f172a;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
 border-bottom:1px solid rgba(255,255,255,0.08);
 z-index:1000;
}

.logo{
 font-weight:bold;
 color:#ff1e00;
}

.user{
 font-size:14px;
 opacity:0.8;
 cursor:pointer;
}

/* AUTH */
.auth{
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 gap:10px;
}

.auth input{
 padding:12px;
 width:250px;
 border-radius:8px;
 border:none;
}

.auth button{
 padding:12px;
 width:250px;
 border:none;
 border-radius:8px;
 background:#ff1e00;
 color:white;
 cursor:pointer;
}

/* FEED */
.feed{
 display:none;
 padding-top:80px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:25px;
}

/* POST CARD */
.post{
 width:100%;
 max-width:500px;
 background:#0f172a;
 border-radius:16px;
 overflow:hidden;
}

.post-header{
 padding:12px;
 font-weight:bold;
 font-size:14px;
 border-bottom:1px solid rgba(255,255,255,0.05);
}

.post img{
 width:100%;
}

.post-content{
 padding:15px;
 font-size:14px;
}

/* CREATE POST */
.create{
 position:fixed;
 bottom:20px;
 right:20px;
 background:#ff1e00;
 padding:15px;
 border-radius:50%;
 cursor:pointer;
}

/* MODAL */
.modal{
 position:fixed;
 top:0;
 left:0;
 width:100%;
 height:100%;
 background:rgba(0,0,0,0.8);
 display:none;
 align-items:center;
 justify-content:center;
}

.modal-box{
 background:#0f172a;
 padding:20px;
 border-radius:12px;
 display:flex;
 flex-direction:column;
 gap:10px;
}

.modal-box textarea{
 width:300px;
 height:100px;
}
</style>
</head>

<body>

<div class="topbar">
 <div class="logo">HMBlog</div>
 <div class="user" onclick="logout()">Logout</div>
</div>

<!-- LOGIN -->
<div class="auth" id="authBox">
<h2>HMBlog</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

<!-- FEED -->
<div class="feed" id="feed"></div>

<div class="create" onclick="openPost()">+</div>

<!-- POST MODAL -->
<div class="modal" id="modal">
 <div class="modal-box">
  <textarea id="postText" placeholder="Mit gondolsz?"></textarea>
  <button onclick="sendPost()">Posztolás</button>
 </div>
</div>

<script>

// LOGIN
async function login(){
 const email = emailInput.value;
 const password = passwordInput.value;

 const { error } = await window.supabaseClient.auth.signInWithPassword({
   email,password
 });

 if(error) alert(error.message);
 else loadApp();
}

// REGISTER
async function register(){
 const email = emailInput.value;
 const password = passwordInput.value;

 const { error } = await window.supabaseClient.auth.signUp({
   email,password
 });

 if(error) alert(error.message);
 else alert("Sikeres!");
}

// LOAD APP
async function loadApp(){
 authBox.style.display="none";
 feed.style.display="flex";
 loadPosts();
}

// LOAD POSTS
async function loadPosts(){
 const { data } = await window.supabaseClient
  .from("posts")
  .select("*")
  .order("id",{ascending:false});

 feed.innerHTML="";

 data.forEach(p=>{
  const div = document.createElement("div");
  div.className="post";

  div.innerHTML=`
   <div class="post-header">User</div>
   <img src="${p.image || 'https://via.placeholder.com/500'}">
   <div class="post-content">${p.text}</div>
  `;

  feed.appendChild(div);
 });
}

// MODAL
function openPost(){
 modal.style.display="flex";
}

async function sendPost(){
 const text = postText.value;

 await window.supabaseClient.from("posts").insert([{text}]);

 modal.style.display="none";
 postText.value="";
 loadPosts();
}

// LOGOUT
async function logout(){
 await window.supabaseClient.auth.signOut();
 location.reload();
}

// AUTO LOGIN
window.supabaseClient.auth.getSession().then(({data})=>{
 if(data.session) loadApp();
});
</script>

</body>
</html>
