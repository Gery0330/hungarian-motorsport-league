<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>League Manager</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{
 background:#020617;
 color:white;
 font-family:Arial;
 padding:40px;
}

.tabs{
 display:flex;
 gap:10px;
 margin-bottom:30px;
}

.tabs button{
 background:#111827;
 padding:10px;
 border:none;
 color:white;
 cursor:pointer;
}

.tabs button:hover{
 background:#ff1e00;
}

.tab{
 display:none;
}

.tab.active{
 display:block;
}

input{
 display:block;
 margin:10px 0;
 padding:10px;
 width:300px;
}

</style>
</head>

<body>

<h1>LEAGUE MANAGER PANEL</h1>

<div class="tabs">
 <button onclick="openTab('f123')">F1 23</button>
 <button onclick="openTab('f125')">F1 25</button>
 <button onclick="openTab('lmu')">LMU</button>
</div>

<div id="f123" class="tab"></div>
<div id="f125" class="tab"></div>
<div id="lmu" class="tab"></div>

<script>

function openTab(tab){
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 document.getElementById(tab).classList.add("active");
 loadStandings(tab);
}

async function loadStandings(tab){

 const map = {
  f123:"F1 23",
  f125:"F1 25",
  lmu:"Le Mans Ultimate"
 };

 const { data } = await window.supabaseClient
  .from("standings")
  .select("*")
  .eq("championship", map[tab])
  .order("points",{ascending:false});

 const container = document.getElementById(tab);
 container.innerHTML="";

 data.forEach(d=>{
  container.innerHTML += `
   <div style="margin:10px;padding:10px;background:#111;">
    <b>${d.driver_name}</b><br>

    <input value="${d.team}" 
    onchange="updateTeam('${d.id}', this.value)">

    <input type="number" value="${d.points}" 
    onchange="updatePoints('${d.id}', this.value)">
   </div>
  `;
 });

}

async function updateTeam(id,val){
 await window.supabaseClient
  .from("standings")
  .update({team:val})
  .eq("id",id);
}

async function updatePoints(id,val){
 await window.supabaseClient
  .from("standings")
  .update({points:val})
  .eq("id",id);
}

</script>

</body>
</html>
