<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>League Manager</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{
 background:#020617;
 color:white;
 font-family:Arial;
 padding:40px;
}

.tabs{
 display:flex;
 gap:10px;
 margin-bottom:30px;
}

.tabs button{
 background:#111827;
 padding:10px;
 border:none;
 color:white;
 cursor:pointer;
}

.tabs button:hover{
 background:#ff1e00;
}

.tab{
 display:none;
}

.tab.active{
 display:block;
}

input{
 display:block;
 margin:10px 0;
 padding:10px;
 width:300px;
}

</style>
</head>

<body>

<h1>LEAGUE MANAGER PANEL</h1>

<div class="tabs">
 <button onclick="openTab('f123')">F1 23</button>
 <button onclick="openTab('f125')">F1 25</button>
 <button onclick="openTab('lmu')">LMU</button>
</div>

<div id="f123" class="tab">

<h3>Új pilóta</h3>

<input id="driver_f123" placeholder="Pilóta neve">
<input id="team_f123" placeholder="Csapat">
<input id="points_f123" type="number" placeholder="Pontok">

<button onclick="addDriver('f123')">Hozzáadás</button>

<hr>

<div id="list_f123"></div>

</div>

<div id="f125" class="tab">

<h3>Új pilóta</h3>

<input id="driver_f125" placeholder="Pilóta neve">
<input id="team_f125" placeholder="Csapat">
<input id="points_f125" type="number" placeholder="Pontok">

<button onclick="addDriver('f125')">Hozzáadás</button>

<hr>

<div id="list_f125"></div>

</div>

<div id="lmu" class="tab">

<h3>Új pilóta</h3>

<input id="driver_lmu" placeholder="Pilóta neve">
<input id="team_lmu" placeholder="Csapat">
<input id="points_lmu" type="number" placeholder="Pontok">

<button onclick="addDriver('lmu')">Hozzáadás</button>

<hr>

<div id="list_lmu"></div>

</div>

<script>

function openTab(tab){
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 document.getElementById(tab).classList.add("active");
 loadStandings(tab);
}

async function loadStandings(tab){

 const map = {
  f123:"F1 23",
  f125:"F1 25",
  lmu:"Le Mans Ultimate"
 };

 const { data } = await window.supabaseClient
  .from("standings")
  .select("*")
  .eq("championship", map[tab])
  .order("points",{ascending:false});

 const container = document.getElementById("list_" + tab);
 container.innerHTML="";

 (data || []).forEach(d=>{
   container.innerHTML += `
    <div style="margin:10px;padding:10px;background:#111;">
     <b>${d.driver_name}</b><br>
 
     <input value="${d.team}" 
     onchange="updateTeam('${d.id}', this.value)">
 
     <input type="number" value="${d.points}" 
     onchange="updatePoints('${d.id}', this.value)">
 
     <button onclick="deleteDriver('${d.id}', '${tab}')"
     style="margin-top:8px;background:#6a0000;">
       ❌ Törlés
     </button>
    </div>
   `;
 });

}

async function updateTeam(id,val){
 await window.supabaseClient
  .from("standings")
  .update({team:val})
  .eq("id",id);
}

async function updatePoints(id,val){
 await window.supabaseClient
  .from("standings")
  .update({points:val})
  .eq("id",id);
}

async function addDriver(tab){

 const map = {
  f123:"F1 23",
  f125:"F1 25",
  lmu:"Le Mans Ultimate"
 };

 const name = document.getElementById("driver_"+tab).value;
 const team = document.getElementById("team_"+tab).value;
 const points = document.getElementById("points_"+tab).value;

 if(!name || !team){
  alert("Tölts ki mindent!");
  return;
 }

 const { error } = await window.supabaseClient
  .from("standings")
  .insert([{
   driver_name:name,
   team:team,
   points:points || 0,
   championship:map[tab]
  }]);

 if(error){
  console.error(error);
  alert("Hiba!");
  return;
 }

 document.getElementById("driver_"+tab).value="";
 document.getElementById("team_"+tab).value="";
 document.getElementById("points_"+tab).value="";

 loadStandings(tab);
}

</script>

</body>
</html>
