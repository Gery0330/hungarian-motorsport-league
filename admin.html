<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>HML Admin</title>

<style>
body{
 background:#020617;
 color:white;
 font-family:Arial;
 padding:40px;
}

input, select{
 display:block;
 margin:10px 0;
 padding:10px;
 width:300px;
}

button{
 padding:10px 20px;
 background:#ff1e00;
 color:white;
 border:none;
 cursor:pointer;
 margin-top:10px;
}

.race{
 margin-top:20px;
 padding:15px;
 background:#111827;
 border-radius:10px;
}

.tabs{
 display:flex;
 gap:10px;
 margin-bottom:30px;
}

.tabs button{
 background:#111827;
 border:1px solid rgba(255,255,255,0.1);
}

.tabs button:hover{
 background:#ff1e00;
}

.tab-content{
 display:none;
}

.tab-content.active{
 display:block;
}

</style>
</head>

<body>

<h1>ADMIN PANEL</h1>

<div class="tabs">
  <button onclick="showTab('races')">Races</button>
  <button onclick="showTab('regs')">Registrations</button>
  <button onclick="showTab('standings')">Standings</button>
</div>

<div id="tab-races" class="tab-content">

<h2>Új verseny</h2>

<input id="league" placeholder="Liga (pl: F1 25)">
<input id="track" placeholder="Pálya (pl: Spa)">
<input id="time" type="datetime-local">

<button onclick="addRace()">Hozzáadás</button>

<h2>Versenyek</h2>
<div id="raceList"></div>
</div>

<div id="tab-regs" class="tab-content">

<h2>Jelentkezések</h2>
<div id="regList"></div>
</div>

<div id="tab-standings" class="tab-content">

<h3>Kategória</h3>

<select id="categorySelect" onchange="loadStandings()">
  <option>F1 23</option>
  <option>F1 24</option>
  <option>F1 25</option>
  <option>Le Mans Ultimate</option>
</select>

<h3>Új pilóta</h3>

<input id="driverName" placeholder="Pilóta neve">
<input id="teamName" placeholder="Csapat">
<input id="points" type="number" placeholder="Pontok">

<button onclick="addDriver()">Hozzáadás</button>

<h3>Pilóták</h3>
<div id="standingsList"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

async function hash(text){
 const encoder = new TextEncoder();
 const data = encoder.encode(text);
 const hashBuffer = await crypto.subtle.digest("SHA-256", data);
 const hashArray = Array.from(new Uint8Array(hashBuffer));
 return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
}

(async () => {

 const password = prompt("Admin jelszó:");

 const hashed = await hash(password);

 // 🔐 IDE JÖN A HASH (lent adom)
 const correctHash = "6da04c089d5617c3d491734c037d4f0aed1a984d1dce1e0e603afdc7e86bf3d2";

 if(hashed !== correctHash){
  document.body.innerHTML = "Nincs hozzáférés";
  return;
 }

 document.getElementById("categorySelect").value = "F1 25";
 
 showTab("races");
 
 loadRaces();
 loadRegistrations();
 loadStandings();
 
})();

async function addRace(){

 const league = document.getElementById("league").value;
 const track = document.getElementById("track").value;
 const time = document.getElementById("time").value;

 if(!league || !track || !time){
  alert("Tölts ki mindent!");
  return;
 }

 const { error } = await window.supabaseClient
  .from("races")
  .insert([{ league, track, race_time: time }]);

 if(error){
  alert("Hiba!");
  console.error(error);
  return;
 }

 alert("Verseny hozzáadva!");
 loadRaces();
}

async function loadRaces(){

 const { data } = await window.supabaseClient
  .from("races")
  .select("*")
  .order("race_time", { ascending: true });

 const container = document.getElementById("raceList");
 container.innerHTML = "";

 data.forEach(r => {

  container.innerHTML += `
   <div class="race">
    <b>${r.league}</b> - ${r.track}<br>
    ${new Date(r.race_time).toLocaleString()}<br>
    <button onclick="deleteRace('${r.id}')">Törlés</button>
   </div>
  `;

 });

}

async function deleteRace(id){

 await window.supabaseClient
  .from("races")
  .delete()
  .eq("id", id);

 loadRaces();
}

async function loadRegistrations(){

 const { data } = await window.supabaseClient
  .from("registrations")
  .select("*")
  .order("id", { ascending:false });

 const container = document.getElementById("regList");
 container.innerHTML = "";

 data.forEach(r => {

  container.innerHTML += `
   <div class="race">
    <b>${r.full_name}</b> (${r.gamer_tag})<br>
    ${r.championship} - ${r.platform}<br>
    ${r.email}<br>
    <button onclick="deleteRegistration('${r.id}')">Törlés</button>
   </div>
  `;

 });
}

async function deleteRegistration(id){

 await window.supabaseClient
  .from("registrations")
  .delete()
  .eq("id", id);

 loadRegistrations();
}

async function loadStandings(){

 const championship = document.getElementById("categorySelect").value;

 const { data } = await window.supabaseClient
  .from("standings")
  .select("*")
  .eq("championship", championship)
  .order("points", { ascending:false });

 const container = document.getElementById("standingsList");
 container.innerHTML = "";

 data.forEach(r => {

  container.innerHTML += `
   <div class="race">
    <b>${r.driver_name}</b><br>

    Csapat:
    <input value="${r.team}" onchange="updateTeam('${r.id}', this.value)"><br>

    Pontok:
    <input type="number" value="${r.points}" onchange="updatePoints('${r.id}', this.value)"><br>

    <button onclick="deleteStanding('${r.id}')">Törlés</button>
   </div>
  `;

 });
}

async function deleteStanding(id){

 await window.supabaseClient
  .from("standings")
  .delete()
  .eq("id", id);

 loadStandings();
}

async function editPoints(id, current){

 const newPoints = prompt("Új pont:", current);

 if(newPoints === null) return;

 await window.supabaseClient
  .from("standings")
  .update({ points: newPoints })
  .eq("id", id);

 loadStandings();
}

function showTab(tab){

 document.querySelectorAll(".tab-content")
  .forEach(el => el.classList.remove("active"));

 document.getElementById("tab-" + tab)
  .classList.add("active");

}

async function addDriver(){

 const name = document.getElementById("driverName").value;
 const team = document.getElementById("teamName").value;
 const points = document.getElementById("points").value;
 const championship = document.getElementById("categorySelect").value;

 if(!name || !team){
  alert("Hiányzó adat!");
  return;
 }

 await window.supabaseClient
  .from("standings")
  .insert([{
    driver_name: name,
    team: team,
    points: points || 0,
    championship: championship
  }]);

 loadStandings();
}

async function updateTeam(id, value){

 await window.supabaseClient
  .from("standings")
  .update({ team: value })
  .eq("id", id);

}

async function updatePoints(id, value){

 await window.supabaseClient
  .from("standings")
  .update({ points: value })
  .eq("id", id);

}

</script>

</body>
</html>
