<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>HML Admin</title>

<style>
body{
 background:#020617;
 color:white;
 font-family:Arial;
 padding:40px;
}

input, select{
 display:block;
 margin:10px 0;
 padding:10px;
 width:300px;
}

button{
 padding:10px 20px;
 background:#ff1e00;
 color:white;
 border:none;
 cursor:pointer;
 margin-top:10px;
}

.race{
 margin-top:20px;
 padding:15px;
 background:#111827;
 border-radius:10px;
}

.tabs{
 display:flex;
 gap:10px;
 margin-bottom:30px;
}

.tabs button{
 background:#111827;
 border:1px solid rgba(255,255,255,0.1);
}

.tabs button:hover{
 background:#ff1e00;
}

.tab-content{
 display:none;
}

.tab-content.active{
 display:block;
}

</style>
</head>

<body>

<h1>ADMIN PANEL</h1>

<div class="tabs">
  <button onclick="showTab('races')">Races</button>
  <button onclick="showTab('regs')">Registrations</button>
</div>

<div id="tab-races" class="tab-content">

<h2>Új verseny</h2>

<input id="league" placeholder="Liga (pl: F1 25)">
<input id="track" placeholder="Pálya (pl: Spa)">
<input id="time" type="datetime-local">

<button onclick="addRace()">Hozzáadás</button>

<h2>Versenyek</h2>
<div id="raceList"></div>
</div>

<div id="tab-regs" class="tab-content">

<h2>Jelentkezések</h2>
<div id="regList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

async function hash(text){
 const encoder = new TextEncoder();
 const data = encoder.encode(text);
 const hashBuffer = await crypto.subtle.digest("SHA-256", data);
 const hashArray = Array.from(new Uint8Array(hashBuffer));
 return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
}

(async () => {

 const password = prompt("Admin jelszó:");

 const hashed = await hash(password);

 // 🔐 IDE JÖN A HASH (lent adom)
 const correctHash = "6da04c089d5617c3d491734c037d4f0aed1a984d1dce1e0e603afdc7e86bf3d2";

 if(hashed !== correctHash){
  document.body.innerHTML = "Nincs hozzáférés";
  return;
 }
 
 showTab("races");
 
 loadRaces();
 loadRegistrations();
 
})();

async function addRace(){

 const league = document.getElementById("league").value;
 const track = document.getElementById("track").value;
 const time = document.getElementById("time").value;

 if(!league || !track || !time){
  alert("Tölts ki mindent!");
  return;
 }

 const { error } = await window.supabaseClient
  .from("races")
  .insert([{ league, track, race_time: time }]);

 if(error){
  alert("Hiba!");
  console.error(error);
  return;
 }

 alert("Verseny hozzáadva!");
 loadRaces();
}

async function loadRaces(){

 const { data } = await window.supabaseClient
  .from("races")
  .select("*")
  .order("race_time", { ascending: true });

 const container = document.getElementById("raceList");
 container.innerHTML = "";

 data.forEach(r => {

  container.innerHTML += `
   <div class="race">
    <b>${r.league}</b> - ${r.track}<br>
    ${new Date(r.race_time).toLocaleString()}<br>
    <button onclick="deleteRace('${r.id}')">Törlés</button>
   </div>
  `;

 });

}

async function deleteRace(id){

 await window.supabaseClient
  .from("races")
  .delete()
  .eq("id", id);

 loadRaces();
}

async function loadRegistrations(){

 const { data } = await window.supabaseClient
  .from("registrations")
  .select("*")
  .order("id", { ascending:false });

 const container = document.getElementById("regList");
 container.innerHTML = "";

 data.forEach(r => {

  container.innerHTML += `
   <div class="race">
    <b>${r.full_name}</b> (${r.gamer_tag})<br>
    ${r.championship} - ${r.platform}<br>
    ${r.email}<br>
    <button onclick="deleteRegistration('${r.id}')">Törlés</button>
   </div>
  `;

 });
}

async function deleteRegistration(id){

 await window.supabaseClient
  .from("registrations")
  .delete()
  .eq("id", id);

 loadRegistrations();
}

function showTab(tab){

 document.querySelectorAll(".tab-content")
  .forEach(el => el.classList.remove("active"));

 document.getElementById("tab-" + tab)
  .classList.add("active");

}

</script>

</body>
</html>
