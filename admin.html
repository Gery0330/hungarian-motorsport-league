<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>HML Admin</title>

<style>
body{
 background:#020617;
 color:white;
 font-family:Arial;
 padding:40px;
}

input, select{
 display:block;
 margin:10px 0;
 padding:10px;
 width:300px;
}

button{
 padding:10px 20px;
 background:#ff1e00;
 color:white;
 border:none;
 cursor:pointer;
 margin-top:10px;
}

.race{
 margin-top:20px;
 padding:15px;
 background:#111827;
 border-radius:10px;
}
</style>
</head>

<body>

<h1>ADMIN PANEL</h1>

<h2>Új verseny</h2>

<input id="league" placeholder="Liga (pl: F1 25)">
<input id="track" placeholder="Pálya (pl: Spa)">
<input id="time" type="datetime-local">

<button onclick="addRace()">Hozzáadás</button>

<h2>Versenyek</h2>
<div id="raceList"></div>

<h2>Jelentkezések</h2>
<div id="regList"></div>

<h2>Standings</h2>
<div id="standingsList"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

async function hash(text){
 const encoder = new TextEncoder();
 const data = encoder.encode(text);
 const hashBuffer = await crypto.subtle.digest("SHA-256", data);
 const hashArray = Array.from(new Uint8Array(hashBuffer));
 return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
}

(async () => {

 const password = prompt("Admin jelszó:");

 const hashed = await hash(password);

 // 🔐 IDE JÖN A HASH (lent adom)
 const correctHash = "6da04c089d5617c3d491734c037d4f0aed1a984d1dce1e0e603afdc7e86bf3d2";

 if(hashed !== correctHash){
   document.body.innerHTML = "Nincs hozzáférés";
   throw new Error("No access");
 }

})();

async function addRace(){

 const league = document.getElementById("league").value;
 const track = document.getElementById("track").value;
 const time = document.getElementById("time").value;

 if(!league || !track || !time){
  alert("Tölts ki mindent!");
  return;
 }

 const { error } = await window.supabaseClient
  .from("races")
  .insert([{ league, track, race_time: time }]);

 if(error){
  alert("Hiba!");
  console.error(error);
  return;
 }

 alert("Verseny hozzáadva!");
 loadRaces();
}

async function loadRaces(){

 const { data } = await window.supabaseClient
  .from("races")
  .select("*")
  .order("race_time", { ascending: true });

 const container = document.getElementById("raceList");
 container.innerHTML = "";

 data.forEach(r => {

  container.innerHTML += `
   <div class="race">
    <b>${r.league}</b> - ${r.track}<br>
    ${new Date(r.race_time).toLocaleString()}<br>
    <button onclick="deleteRace('${r.id}')">Törlés</button>
   </div>
  `;

 });

}

async function deleteRace(id){

 await window.supabaseClient
  .from("races")
  .delete()
  .eq("id", id);

 loadRaces();
}

loadRaces();
loadRegistrations();
loadStandings();

async function loadRegistrations(){

 const { data } = await window.supabaseClient
  .from("registrations")
  .select("*")
  .order("id", { ascending:false });

 const container = document.getElementById("regList");
 container.innerHTML = "";

 data.forEach(r => {

  container.innerHTML += `
   <div class="race">
    <b>${r.full_name}</b> (${r.gamer_tag})<br>
    ${r.championship} - ${r.platform}<br>
    ${r.email}<br>
    <button onclick="deleteRegistration('${r.id}')">Törlés</button>
   </div>
  `;

 });
}

async function deleteRegistration(id){

 await window.supabaseClient
  .from("registrations")
  .delete()
  .eq("id", id);

 loadRegistrations();
}

async function loadStandings(){

 const { data } = await window.supabaseClient
  .from("standings")
  .select("*")
  .order("points", { ascending:false });

 const container = document.getElementById("standingsList");
 container.innerHTML = "";

 data.forEach(r => {

  container.innerHTML += `
   <div class="race">
    <b>${r.driver_name}</b> (${r.team})<br>
    ${r.championship}<br>
    Pontok: ${r.points}<br>
    <button onclick="editPoints('${r.id}', ${r.points})">Edit</button>
    <button onclick="deleteStanding('${r.id}')">Törlés</button>
   </div>
  `;

 });
}

async function deleteStanding(id){

 await window.supabaseClient
  .from("standings")
  .delete()
  .eq("id", id);

 loadStandings();
}

async function editPoints(id, current){

 const newPoints = prompt("Új pont:", current);

 if(newPoints === null) return;

 await window.supabaseClient
  .from("standings")
  .update({ points: newPoints })
  .eq("id", id);

 loadStandings();
}

</script>

</body>
</html>
