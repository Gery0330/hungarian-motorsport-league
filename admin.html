<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>HML Admin</title>

<style>
body{
 background:#020617;
 color:white;
 font-family:Arial;
 padding:40px;
}

input, select{
 display:block;
 margin:10px 0;
 padding:10px;
 width:300px;
}

button{
 padding:10px 20px;
 background:#ff1e00;
 color:white;
 border:none;
 cursor:pointer;
 margin-top:10px;
}

.race{
 margin-top:20px;
 padding:15px;
 background:#111827;
 border-radius:10px;
}

.tabs{
 display:flex;
 gap:10px;
 margin-bottom:30px;
}

.tabs button{
 background:#111827;
 border:1px solid rgba(255,255,255,0.1);
}

.tabs button:hover{
 background:#ff1e00;
}

.tab-content{
 display:none;
}

.tab-content.active{
 display:block;
}

</style>
</head>

<body>

<h1>ADMIN PANEL</h1>

<div class="tabs">
  <button onclick="showTab('races')">Races</button>
  <button onclick="showTab('regs')">Registrations</button>
  <button onclick="showTab('news')">News</button>
</div>

<div id="tab-news" class="tab-content">

<h2>Új hír</h2>

<input id="news_title" placeholder="Cím">
<select id="news_league">

<option value="">Általános Hír</option>

<option value="F1 23">F1 23</option>

<option value="F1 25">F1 25</option>

<option value="F1 26">F1 26</option>

<option value="LMU">LMU</option>

</select>

<textarea id="news_content" placeholder="Tartalom" style="width:300px;height:120px;"></textarea>

<button onclick="addNews()">Közzététel</button>

<h2>Hírek</h2>
<div id="newsList"></div>

</div>

<div id="tab-races" class="tab-content">

<h2>Új verseny</h2>

<select id="league" onchange="updateTracks()">
  <option value="">Liga kiválasztása</option>
  <option value="F1 23">F1 23</option>
  <option value="F1 25">F1 25</option>
  <option value="F1 26">F1 26</option>
  <option value="LMU">LMU</option>
</select>

<select id="track">
  <option value="">Először válassz ligát</option>
</select>

<input id="time" type="datetime-local">

<button onclick="addRace()">Hozzáadás</button>

<h2>Versenyek</h2>
<div id="raceList"></div>
</div>

<div id="tab-regs" class="tab-content">

<h2>Jelentkezések</h2>
<div id="regList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

async function hash(text){
 const encoder = new TextEncoder();
 const data = encoder.encode(text);
 const hashBuffer = await crypto.subtle.digest("SHA-256", data);
 const hashArray = Array.from(new Uint8Array(hashBuffer));
 return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
}

(async () => {

 const password = prompt("Admin jelszó:");

 const hashed = await hash(password);

 // 🔐 IDE JÖN A HASH (lent adom)
 const correctHash = "6da04c089d5617c3d491734c037d4f0aed1a984d1dce1e0e603afdc7e86bf3d2";

 if(hashed !== correctHash){
  document.body.innerHTML = "Nincs hozzáférés";
  return;
 }
 
 showTab("races");
 
 loadRaces();
 loadRegistrations();
 loadNews();
 
})();

async function addRace(){

 const league = document.getElementById("league").value;
 const track = document.getElementById("track").value;
 const time = document.getElementById("time").value;

 if(!league || !track || !time){
  alert("Tölts ki mindent!");
  return;
 }

 const { error } = await window.supabaseClient
  .from("races")
  .insert([{ league, track, race_time: time }]);

 if(error){
  alert("Hiba!");
  console.error(error);
  return;
 }

 alert("Verseny hozzáadva!");
 loadRaces();
}

async function loadRaces(){

 const { data, error } = await window.supabaseClient
  .from("races")
  .select("*")
  .order("race_time", { ascending: true });

 if(error){
  console.error(error);
  alert("Hiba a races betöltésnél!");
  return;
 }

 const container = document.getElementById("raceList");
 container.innerHTML = "";

 (data || []).forEach(r => {

  container.innerHTML += `
   <div class="race">
    <b>${r.league}</b> - ${r.track}<br>
    ${new Date(r.race_time).toLocaleString()}<br>
    <button onclick="deleteRace('${r.id}')">Törlés</button>
   </div>
  `;

 });

}

async function deleteRace(id){

 await window.supabaseClient
  .from("races")
  .delete()
  .eq("id", id);

 loadRaces();
}

async function loadRegistrations(){

 const { data, error } = await window.supabaseClient
  .from("registrations")
  .select("*")
  .order("id", { ascending:false });

 if(error){
  console.error(error);
  alert("Hiba a registrations betöltésnél!");
  return;
 }

 const container = document.getElementById("regList");
 container.innerHTML = "";

 (data || []).forEach(r => {

  container.innerHTML += `
   <div class="race">
    <b>${r.full_name}</b> (${r.gamer_tag})<br>
    ${r.championship} - ${r.platform}<br>
    ${r.email}<br>
    <button onclick="deleteRegistration('${r.id}')">Törlés</button>
   </div>
  `;

 });

}

async function deleteRegistration(id){

 await window.supabaseClient
  .from("registrations")
  .delete()
  .eq("id", id);

 loadRegistrations();
}

function showTab(tab){

 document.querySelectorAll(".tab-content")
  .forEach(el => el.classList.remove("active"));

 document.getElementById("tab-" + tab)
  .classList.add("active");

}

function updateTracks(){

 const league = document.getElementById("league").value;
 const trackSelect = document.getElementById("track");

 let tracks = [];

 if(
  league === "F1 23" ||
  league === "F1 25" ||
  league === "F1 26"
 ){
  tracks = [
   "Ausztrália","Kína","Japán","Bahrein","Szaúd-Arábia",
   "Miami","Austin","Las Vegas",
   "Olaszország","Imola","Monaco","Spanyolország",
   "Kanada","Ausztria","Egyesült Királyság","Belgium",
   "Magyarország","Hollandia","Azerbajdzsán","Szingapúr",
   "Mexikó","Brazília","Katar","Egyesült Arab Emírségek",
   "Franciaország","Portugália"
  ];
 }

 if(league === "LMU"){
  tracks = [
   "LeMans","Portimao","Spa","Monza","Fuji",
   "Bahrain","Austin","Interlagos","Losail","Imola"
  ];
 }

 trackSelect.innerHTML = '<option value="">Pálya kiválasztása</option>';

 tracks.forEach(t=>{
  trackSelect.innerHTML += `<option value="${t}">${t}</option>`;
 });

}

async function addNews(){

 const title = document.getElementById("news_title").value;
 const content = document.getElementById("news_content").value;
 const league = document.getElementById("news_league").value;

 if(!title || !content){
  alert("Tölts ki mindent!");
  return;
 }

 const { error } = await window.supabaseClient
  .from("news")
  .insert([{ title, content, league }]);

 if(error){
  console.error(error);
  alert("Hiba!");
  return;
 }

 document.getElementById("news_title").value="";
 document.getElementById("news_content").value="";
 document.getElementById("news_league").value="";

 loadNews();
}

async function loadNews(){

 const { data } = await window.supabaseClient
  .from("news")
  .select("*")
  .order("created_at",{ascending:false});

 const container = document.getElementById("newsList");
 container.innerHTML = "";

 (data || []).forEach(n=>{

  container.innerHTML += `
   <div class="race">
     <b>${n.title}</b><br>
     ${n.league || ""}<br><br>
     ${n.content}<br>
     <button onclick="deleteNews('${n.id}')">Törlés</button>
   </div>
  `;
 });
}

async function deleteNews(id){

 await window.supabaseClient
  .from("news")
  .delete()
  .eq("id", id);

 loadNews();
}


</script>

</body>
</html>
