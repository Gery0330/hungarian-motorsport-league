<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Hall of Fame — Hungarian Motorsport League</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
background:#05070c;
color:white;
}

/* HERO */

.hero{
height:50vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:
linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.9)),
url("https://baseballhall.org/sites/default/files/2023-01/hero-hall-of-fame.jpeg");
background-size:cover;
background-position:center;
}

.hero h1{
font-size:70px;
color:#ffd700;
text-shadow:
0 0 20px #ffd700,
0 0 40px #ffcc00;
}

/* HALL OF FAME */

.hof{
padding:120px 40px;
max-width:1300px;
margin:auto;
}

.hof-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:40px;
}

/* CHAMPION CARD */

.champion-card{

display:grid;
grid-template-columns: 1fr 2fr 1fr;
align-items:center;

background:linear-gradient(145deg,#0d1117,#111827);
border-radius:18px;
padding:40px;

border:2px solid #ffd700;

box-shadow:
0 0 25px rgba(255,215,0,0.3);

transition:0.4s;
}

.champion-card:hover{

transform:scale(1.05);

box-shadow:
0 0 40px rgba(255,215,0,0.6),
0 0 80px rgba(255,215,0,0.3);

}

/* TROPHY */

.trophy{
font-size:40px;
margin-bottom:15px;
}

/* NAME */

.name{
font-size:26px;
font-weight:bold;
margin-bottom:10px;
}

/* TEAM */

.team{
color:#9ca3af;
font-size:16px;
margin-bottom:10px;
}

/* LEAGUE */

.league{
color:#ff1e00;
font-weight:bold;
font-size:18px;
}

/* YEAR */

.year{
margin-top:8px;
opacity:.7;
}

.trophy-side img{
width:140px;
filter:drop-shadow(0 0 10px gold);
}

.team-logo{
text-align:right;
}

.team-logo img{
width:140px;
}

.champion-center{
text-align:center;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.back-btn{
position:fixed;
top:20px;
left:20px;
background:#111827;
color:white;
padding:10px 20px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
transition:.3s;
z-index:1000;
}

.back-btn:hover{
background:#ff1e00;
}

.langbtn{
background:#ff1e00;
border:none;
padding:8px 16px;
color:white;
border-radius:6px;
cursor:pointer;
font-weight:bold;
width:auto;
display:inline-block;

position:fixed;
top:20px;
right:30px;
z-index:1000;
}

/* FOOTER */

footer{
text-align:center;
padding:40px;
background:#0d1117;
}

</style>
</head>

<body>

<button class="langbtn" onclick="toggleLang()">
HU / EN
</button>

<a href="index.html" class="back-btn"
data-hu="← Vissza a főoldalra"
data-en="← Back to homepage">
← Vissza a főoldalra
</a>

<div class="hero">

<h1 
data-hu="🏆 Dicsőség Csarnoka"
data-en="🏆 Hall of Fame">
🏆 Hall of Fame
</h1>

</div>

<section class="hof">

<div class="hof-grid">

<div class="champion-card">

<div class="trophy-side">
<img src="f1-trophy.png">
</div>

<div class="champion-center">

<div class="name">Borbély Bálint</div>

<div class="team">Red Bull Racing</div>

<div class="league">F1 23 Championship</div>

<div class="year">1. Szezon Champion</div>

</div>

<div class="team-logo">
<img src="redbull.png">
</div>

</div>

</section>

<footer>
© 2025 Hungarian Motorsport League
</footer>

<script>

let lang = localStorage.getItem("lang") || "hu";

function toggleLang(){
 lang = lang === "hu" ? "en" : "hu";
 localStorage.setItem("lang", lang);

 document.querySelectorAll("[data-hu]").forEach(el=>{
   el.innerHTML = el.getAttribute("data-"+lang);
 });

}

document.addEventListener("DOMContentLoaded", ()=>{
 document.querySelectorAll("[data-hu]").forEach(el=>{
   el.innerHTML = el.getAttribute("data-"+lang);
 });
});

</script>

</body>

</html>
