<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HML Calendar</title>

<style>
body{
 background:#05070c;
 color:white;
 font-family:Arial;
 margin:0;
 padding:40px;
}

h1{
 text-align:center;
 margin-bottom:20px;
}

.filter{
 text-align:center;
 margin-bottom:30px;
}

.filter button{
 margin:0 10px;
 padding:10px 20px;
 border:none;
 border-radius:8px;
 background:#111827;
 color:white;
 cursor:pointer;
}

.filter button.active{
 background:#ff1e00;
}

.race{
 background:linear-gradient(145deg,#020617,#0f172a);
 padding:20px;
 margin:15px auto;
 max-width:700px;
 border-radius:12px;
 border-left:4px solid #ff1e00;
 box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.track{
 font-size:22px;
 font-weight:bold;
}

.date{
 opacity:0.7;
 margin-top:5px;
}

.countdown{
 margin-top:10px;
 font-weight:bold;
 color:#ff1e00;
}

.live{
 color:#ff1e00;
 text-shadow:0 0 15px #ff1e00;
}

.league-panel{
 background:linear-gradient(145deg,#020617,#0f172a);
 padding:30px;
 border-radius:18px;
 box-shadow:0 0 40px rgba(0,0,0,0.7);
 border:1px solid #1f2937;
 margin-bottom:40px;
}

.stand-row{
 display:flex;
 justify-content:space-between;
 padding:12px 15px;
 margin:8px 0;
 border-radius:10px;
 background:#111827;
 font-weight:bold;
}

.top1{ border-left:4px solid gold; }
.top2{ border-left:4px solid silver; }
.top3{ border-left:4px solid #cd7f32; }

.driver{ flex:1; text-align:left; }
.team{ flex:1; text-align:center; opacity:0.7; }
.points{ min-width:80px; text-align:right; color:#ff1e00; }

.calendar-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:20px;
 max-width:1200px;
 margin:40px auto;
}

.race-card{
 position:relative;
 border-radius:15px;
 overflow:hidden;
 cursor:pointer;

 background:#111;

 box-shadow:0 0 20px rgba(0,0,0,0.6);
 transition:.3s;
}

.race-card:hover{
 transform:scale(1.05);
 box-shadow:0 0 30px #ff1e00;
}

.race-card img{
 width:100%;
 height:140px;
 object-fit:cover;

 transform:scale(1.5); /* 🔥 zoom */
 transition:0.4s;
}

.race-card:hover img{
 transform:scale(1.3);
}

.race-card img{
 object-position:left;
}

.race-overlay{
 position:absolute;
 top:0;
 left:0;
 width:100%;
 height:100%;

 background:linear-gradient(transparent,rgba(0,0,0,0.85));

 display:flex;
 flex-direction:column;
 justify-content:flex-end;

 padding:12px;
}

 background:linear-gradient(transparent,rgba(0,0,0,0.8));
 display:flex;
 flex-direction:column;
 justify-content:flex-end;

 padding:10px;
}

.round{
 position:absolute;
 top:10px;
 left:10px;

 background:#ff1e00;
 padding:5px 10px;
 border-radius:6px;
 font-weight:bold;
 font-size:14px;
}

.track-name{
 font-size:18px;
 font-weight:bold;
}

.date{
 font-size:13px;
 opacity:0.8;
}

.nav-arrow{
 background:#111827;
 border:none;
 color:white;
 font-size:22px;
 padding:10px 16px;
 border-radius:8px;
 cursor:pointer;
 transition:.3s;
}

.nav-arrow:hover{
 background:#ff1e00;
 transform:scale(1.1);
}

.countdown{
 margin-top:5px;
 font-size:14px;
 position:relative;
 bottom:5px; /* 🔥 ez emeli fel */
}

.track-name{
 font-size:18px;
 font-weight:bold;
 line-height:1.2;
}

.date{
 font-size:13px;
 margin-top:3px;
 opacity:0.8;
}

.countdown{
 font-size:13px;
 margin-top:5px;
 color:#ff1e00;
}

.live{
 font-size:13px;
 margin-top:5px;
}

.race-overlay > *{
 margin:0;
}

</style>
</head>

<body>

<h1 style="display:flex;justify-content:center;align-items:center;gap:20px;">

<button onclick="prevLeague()" class="nav-arrow">←</button>

<span id="title">Liga naptár</span>

<button onclick="nextLeague()" class="nav-arrow">→</button>

</h1>
<div id="standingsContainer"></div>

<div class="filter">
<button onclick="setFilter('all')" class="active">Összes</button>
<button onclick="setFilter('upcoming')">Közelgő</button>
<button onclick="setFilter('past')">Múlt</button>
</div>

<div id="raceList" class="calendar-grid"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
let league = params.get("league");

// 🔥 FIX LMU mismatch
if(league === "Le Mans Ultimate"){
 league = "LMU";
}

let displayName = league;

if(league === "LMU"){
 displayName = "Le Mans Ultimate";
}

document.getElementById("title").innerText = displayName + " naptár";

let races = [];
let filter = "all";

function setFilter(f){
 filter = f;

 document.querySelectorAll(".filter button").forEach(b=>b.classList.remove("active"));
 event.target.classList.add("active");

 render();
}

async function loadCalendar(){

 const map = {
  "F1 23":"F1 23",
  "F1 25":"F1 25",
  "Le Mans Ultimate":"LMU"
 };
 
 const dbLeague = map[params.get("league")] || params.get("league");
 
 const { data, error } = await window.supabaseClient
   .from("races")
   .select("*")
   .eq("league", dbLeague)
   .order("race_time", { ascending:true });
 
 if(error){
  console.error(error);
  document.getElementById("raceList").innerHTML = "Hiba: " + error.message;
  return;
 }
 
 races = data || [];
 render();
}

function render(){

 const container = document.getElementById("raceList");
 container.innerHTML = "";

 const now = new Date();

 races.forEach(r=>{

   const raceTime = new Date(r.race_time);

   if(filter === "upcoming" && raceTime < now) return;
   if(filter === "past" && raceTime > now) return;

   const diff = raceTime - now;

   let status = "";
   let countdown = "";

   if(diff <= 0){
     status = `<div class="live">🔴 LIVE / LEJÁRT</div>`;
   } else {
     const days = Math.floor(diff / (1000*60*60*24));
     const hours = Math.floor((diff/(1000*60*60))%24);
     const minutes = Math.floor((diff/(1000*60))%60);

     countdown = `<div class="countdown">${days}d ${hours}h ${minutes}m</div>`;
   }

   container.innerHTML += `
     <div class="race-card">
   
       <div class="round">R${r.round || ""}</div>
   
       <img src="${getTrackImage(r.track)}">
   
       <div class="race-overlay">
         <div class="track-name">${r.track}</div>
         <div class="date">${raceTime.toLocaleDateString()}</div>
         ${countdown}
         ${status}
       </div>
   
     </div>
   `;
 });
}

loadCalendar();
setInterval(render, 60000);

async function loadStandings(){

 const map = {
  "F1 23":"F1 23",
  "F1 25":"F1 25",
  "Le Mans Ultimate":"LMU"
 };

 const dbLeague = map[params.get("league")] || params.get("league");

 const { data, error } = await window.supabaseClient
   .from("standings")
   .select("*")
   .eq("championship", dbLeague)
   .order("points", { ascending:false });

 const container = document.getElementById("standingsContainer");

 if(error){
  container.innerHTML = "Standings hiba";
  return;
 }

 if(!data || data.length === 0){
  container.innerHTML = "Nincs standings adat.";
  return;
 }

 let html = `<div class="league-panel"><h3>${displayName} standings</h3>`;

 data.forEach((row,index)=>{

  let extra = "";
  if(index === 0) extra="top1";
  if(index === 1) extra="top2";
  if(index === 2) extra="top3";

  html += `
  <div class="stand-row ${extra}">
    <div>#${index+1}</div>
    <div class="driver">${row.driver_name}</div>
    <div class="team">${row.team}</div>
    <div class="points">${row.points}</div>
  </div>
  `;
 });

 html += "</div>";

 container.innerHTML = html;
}

loadStandings();

function getTrackImage(track){

 const images = {
  "Belgium":"spa.jpg",
  "Austria":"austria.jpg",
  "Hungary":"hungary.jpg",
  "Brazil":"brazil.jpg",
  "Qatar":"qatar.jpg"
 };

 return "tracks/" + (images[track] || "default.jpg");
}

const leagues = ["F1 23","F1 25","Le Mans Ultimate"];

let currentLeagueIndex = leagues.indexOf(params.get("league"));

if(currentLeagueIndex === -1){
 currentLeagueIndex = 0;
}

function goToLeague(index){
 const league = leagues[index];
 window.location.href = "calendar.html?league=" + encodeURIComponent(league);
}

function prevLeague(){
 let i = currentLeagueIndex - 1;
 if(i < 0) i = leagues.length - 1;
 goToLeague(i);
}

function nextLeague(){
 let i = currentLeagueIndex + 1;
 if(i >= leagues.length) i = 0;
 goToLeague(i);
}

</script>

</body>
</html>
