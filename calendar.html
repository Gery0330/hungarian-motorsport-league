<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HML Calendar</title>

<style>
body{
 background:#05070c;
 color:white;
 font-family:Arial;
 margin:0;
 padding:40px;
}

h1{
 text-align:center;
 margin-bottom:20px;
}

.filter{
 text-align:center;
 margin-bottom:30px;
}

.filter button{
 margin:0 10px;
 padding:10px 20px;
 border:none;
 border-radius:8px;
 background:#111827;
 color:white;
 cursor:pointer;
}

.filter button.active{
 background:#ff1e00;
}

.race{
 background:linear-gradient(145deg,#020617,#0f172a);
 padding:20px;
 margin:15px auto;
 max-width:700px;
 border-radius:12px;
 border-left:4px solid #ff1e00;
 box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.track{
 font-size:22px;
 font-weight:bold;
}

.date{
 opacity:0.7;
 margin-top:5px;
}

.countdown{
 margin-top:10px;
 font-weight:bold;
 color:#ff1e00;
}

.live{
 color:#ff1e00;
 text-shadow:0 0 15px #ff1e00;
}

.league-panel{
 background:linear-gradient(145deg,#020617,#0f172a);
 padding:30px;
 border-radius:18px;
 box-shadow:0 0 40px rgba(0,0,0,0.7);
 border:1px solid #1f2937;
 margin-bottom:40px;
}

.stand-row{
 display:flex;
 justify-content:space-between;
 padding:12px 15px;
 margin:8px 0;
 border-radius:10px;
 background:#111827;
 font-weight:bold;
}

.top1{ border-left:4px solid gold; }
.top2{ border-left:4px solid silver; }
.top3{ border-left:4px solid #cd7f32; }

.driver{ flex:1; text-align:left; }
.team{ flex:1; text-align:center; opacity:0.7; }
.points{ min-width:80px; text-align:right; color:#ff1e00; }

</style>
</head>

<body>

<h1 id="title">Liga naptár</h1>
<div id="standingsContainer"></div>

<div class="filter">
<button onclick="setFilter('all')" class="active">Összes</button>
<button onclick="setFilter('upcoming')">Közelgő</button>
<button onclick="setFilter('past')">Múlt</button>
</div>

<div id="raceList"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
let league = params.get("league");

// 🔥 FIX LMU mismatch
if(league === "Le Mans Ultimate"){
 league = "LMU";
}

let displayName = league;

if(league === "LMU"){
 displayName = "Le Mans Ultimate";
}

document.getElementById("title").innerText = displayName + " naptár";

let races = [];
let filter = "all";

function setFilter(f){
 filter = f;

 document.querySelectorAll(".filter button").forEach(b=>b.classList.remove("active"));
 event.target.classList.add("active");

 render();
}

async function loadCalendar(){

 const map = {
  "F1 23":"F1 23",
  "F1 25":"F1 25",
  "Le Mans Ultimate":"LMU"
 };
 
 const dbLeague = map[params.get("league")] || params.get("league");
 
 const { data, error } = await window.supabaseClient
   .from("races")
   .select("*")
   .eq("league", dbLeague)
   .order("race_time", { ascending:true });
 
 if(error){
  console.error(error);
  document.getElementById("raceList").innerHTML = "Hiba: " + error.message;
  return;
 }
}

function render(){

 const container = document.getElementById("raceList");
 container.innerHTML = "";

 const now = new Date();

 races.forEach(r=>{

   const raceTime = new Date(r.race_time);

   if(filter === "upcoming" && raceTime < now) return;
   if(filter === "past" && raceTime > now) return;

   const diff = raceTime - now;

   let status = "";
   let countdown = "";

   if(diff <= 0){
     status = `<div class="live">🔴 LIVE / LEJÁRT</div>`;
   } else {
     const days = Math.floor(diff / (1000*60*60*24));
     const hours = Math.floor((diff/(1000*60*60))%24);
     const minutes = Math.floor((diff/(1000*60))%60);

     countdown = `<div class="countdown">${days}d ${hours}h ${minutes}m</div>`;
   }

   container.innerHTML += `
     <div class="race">
       <div class="track">🏁 ${r.track}</div>
       <div class="date">${raceTime.toLocaleString()}</div>
       ${countdown}
       ${status}
     </div>
   `;
 });
}

loadCalendar();
setInterval(render, 60000);

async function loadStandings(){

 const map = {
  "F1 23":"F1 23",
  "F1 25":"F1 25",
  "Le Mans Ultimate":"LMU"
 };

 const dbLeague = map[params.get("league")] || params.get("league");

 const { data, error } = await window.supabaseClient
   .from("standings")
   .select("*")
   .eq("championship", dbLeague)
   .order("points", { ascending:false });

 const container = document.getElementById("standingsContainer");

 if(error){
  container.innerHTML = "Standings hiba";
  return;
 }

 if(!data || data.length === 0){
  container.innerHTML = "Nincs standings adat.";
  return;
 }

 let html = `<div class="league-panel"><h3>${displayName} standings</h3>`;

 data.forEach((row,index)=>{

  let extra = "";
  if(index === 0) extra="top1";
  if(index === 1) extra="top2";
  if(index === 2) extra="top3";

  html += `
  <div class="stand-row ${extra}">
    <div>#${index+1}</div>
    <div class="driver">${row.driver_name}</div>
    <div class="team">${row.team}</div>
    <div class="points">${row.points}</div>
  </div>
  `;
 });

 html += "</div>";

 container.innerHTML = html;
}

loadStandings();

</script>

</body>
</html>
